line-length = 110
target-version = "py310"

[lint]
select = ["E", "F", "W", "B", "I"]

[lint.isort]
known-first-party = ["collect_flags", "lib_hashverify", "collect_statehash", "lib_statehash", "replay_statehash", "report_statehash", "mutants_statehash", "crosscheck_statehash"]

[lint.per-file-ignores]
# mutant table rows are exact source lines and cannot be wrapped
"mutants_statehash.py" = ["E501"]
